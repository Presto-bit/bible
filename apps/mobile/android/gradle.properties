# 16GB 本机 + 模拟器并行：8G 堆易触发 OOM/Daemon 被系统杀掉，反而更慢。
# 打包时建议先关模拟器，或 workers 改为 2。
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# 并行 + 构建缓存：增量/二次打包明显更快
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 勿默认开 configuration-cache：Flutter + 多插件 AGP 仍易踩坑
# org.gradle.configuration-cache=true
org.gradle.workers.max=4

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# 插件声明 28.2；本机路径为 symlink→27.1
android.ndkVersion=28.2.13676358

# 默认在线：依赖不全时 offline 会导致 merge* 卡死/失败。
# 缓存已齐且必须断网时：ORG_GRADLE_OFFLINE=1 ./scripts/publish_flutter_apk.sh
# 或临时：org.gradle.offline=true
org.gradle.offline=false
