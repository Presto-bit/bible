# 16GB 本机 + 模拟器并行：8G 堆易触发 OOM/Daemon 被系统杀掉，反而更慢。
# 打包时建议先关模拟器，或 workers 改为 2。
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m

# 并行 + 构建缓存：增量/二次打包明显更快
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# 勿默认开 configuration-cache：Flutter + 多插件 AGP 仍易踩坑
# org.gradle.configuration-cache=true
org.gradle.workers.max=4

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false
# 插件声明 28.2；本机路径为 symlink→27.1
android.ndkVersion=28.2.13676358

# Gradle 分发：gradle-9.1.0-bin + 腾讯镜像（见 wrapper）；缓存目录 .gradle-home（见 publish 脚本）
# 本机快包：FAST_BUILD=1 ./scripts/publish_flutter_apk.sh  或  ./scripts/build_flutter_apk_dev.sh fast
